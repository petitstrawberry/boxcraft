[package]
name = "boxcraft"
version = "0.1.0"
edition = "2024"
description = "A cross-platform ScarletUI and SGFX voxel sandbox"
license = "MIT"

[dependencies]
boxcraft-core = { path = "../boxcraft-core" }

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "961db59ee65502a899b2787ce5bdaae2e220fcc6", package = "scarlet-ui", default-features = false, features = ["std", "platform-sws"] }
scarlet-sys = { git = "https://github.com/petitstrawberry/Scarlet", rev = "a339726dda0970597631e1660a50ad40a375d148", package = "scarlet-sys" }

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "961db59ee65502a899b2787ce5bdaae2e220fcc6", package = "scarlet-ui", default-features = false, features = ["std", "platform-winit"] }

[[bin]]
name = "boxcraft"
path = "src/main.rs"
