[package]
name = "boxcraft"
version = "0.1.0"
edition = "2024"
description = "A cross-platform ScarletUI and SGFX voxel sandbox"
license = "MIT"

[dependencies]
boxcraft-core = { path = "../boxcraft-core" }

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "b6a7bec8bc33b2abbf8dda1397529ab836e91ead", package = "scarlet-ui", default-features = false, features = ["std", "platform-sws"] }
scarlet-sys = { git = "https://github.com/petitstrawberry/Scarlet", rev = "5d0fe3ac8c97289a28599bac22fca4ac26a5f9ca", package = "scarlet-sys" }

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "b6a7bec8bc33b2abbf8dda1397529ab836e91ead", package = "scarlet-ui", default-features = false, features = ["std", "platform-winit"] }

[[bin]]
name = "boxcraft"
path = "src/main.rs"
