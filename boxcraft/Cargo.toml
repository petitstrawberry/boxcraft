[package]
name = "boxcraft"
version = "0.1.0"
edition = "2024"
description = "A cross-platform ScarletUI and SGFX voxel sandbox"
license = "MIT"

[dependencies]
boxcraft-core = { path = "../boxcraft-core" }

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "e6e00f11c95de371057899ec05b7a832d04adc7f", package = "scarlet-ui", default-features = false, features = ["std", "platform-sws"] }
scarlet-sys = { git = "https://github.com/petitstrawberry/Scarlet", rev = "b3d2a55740a3d2ca49daad0ec7baba233f706f7a", package = "scarlet-sys" }

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "e6e00f11c95de371057899ec05b7a832d04adc7f", package = "scarlet-ui", default-features = false, features = ["std", "platform-winit"] }

[[bin]]
name = "boxcraft"
path = "src/main.rs"
