[package]
name = "boxcraft"
version = "0.1.0"
edition = "2024"
description = "A cross-platform ScarletUI and SGFX voxel sandbox"
license = "MIT"

[dependencies]
boxcraft-core = { path = "../boxcraft-core" }

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "0307788d09f7e5a439706d00e05308d430767f39", package = "scarlet-ui", default-features = false, features = ["std", "platform-sws"] }
scarlet-sys = { git = "https://github.com/petitstrawberry/Scarlet", rev = "d3b1c05127d4df3616f988b81a99f616e8a88064", package = "scarlet-sys" }

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "0307788d09f7e5a439706d00e05308d430767f39", package = "scarlet-ui", default-features = false, features = ["std", "platform-winit"] }

[[bin]]
name = "boxcraft"
path = "src/main.rs"
